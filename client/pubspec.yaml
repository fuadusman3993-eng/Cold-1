name: ethiodrive
description: "EthioDrive — Premium Ethiopian Car Marketplace"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  # Navigation
  go_router: ^14.0.0
  # DI
  get_it: ^7.7.0
  # Networking
  dio: ^5.4.3
  # Local Storage
  shared_preferences: ^2.2.3
  # Fonts & UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.5
  # WebSocket
  web_socket_channel: ^2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
